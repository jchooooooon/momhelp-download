<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엄마폰 도우미 받기</title>
<style>
body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F5F5F7;color:#1D1D1F;
  display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:28px;padding:32px 24px;max-width:380px;width:100%;text-align:center;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.ic{width:88px;height:88px;border-radius:22px;background:#0063CC;margin:0 auto 18px;display:flex;align-items:center;justify-content:center}
h1{font-size:24px;margin:0 0 8px}
p{color:#6E6E73;font-size:15px;line-height:1.6;margin:0 0 22px}
a.dl{display:block;background:#0063CC;color:#fff;text-decoration:none;font-size:20px;font-weight:700;
  padding:18px;border-radius:16px}
ol{text-align:left;color:#3A3A3C;font-size:14px;line-height:1.7;margin:20px 0 0;padding-left:20px}
</style>
</head>
<body>
<div class="card">
  <div class="ic"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg></div>
  <h1>엄마폰 도우미</h1>
  <p>아들이 엄마 화면을 보며 누를 곳을 화살표로 알려 주는 앱이에요.</p>
  <a class="dl" href="momhelp.apk">앱 받기</a>
  <ol>
    <li>'앱 받기'를 누르면 파일이 받아져요.</li>
    <li>"위험할 수 있어요"가 나오면 <b>그래도 열기 / 설치</b>를 눌러요.</li>
    <li>"출처를 알 수 없는 앱"은 <b>허용</b>으로 켜요.</li>
    <li>처음 열 때 화면·마이크·알림을 <b>허용</b>해요.</li>
  </ol>
</div>
</body>
</html>
